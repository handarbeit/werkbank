# For macos/setup.sh: native macOS runners in a dedicated `ci` user's GUI session.
# An entry is an org (a runner in its pool) or owner/repo (a repo-level runner).
# Append *N for N runners there (my-org*2 -> runners my-org and my-org-2).
TARGETS=(my-org me/side-project)
LABEL=orb-macos
# Credentials per owner, from .env: a GitHub App (owner=app_id:key variable; docs/github-app.md)
# where one is installed, else a PAT (owner=variable); anything unlisted uses ACCESS_TOKEN.
APPS=(my-org=123456:MY_APP_KEY)
TOKEN_VARS=(me=PERSONAL_TOKEN)
# Runners once installed here that should be removed (by name: the repo or org part).
RETIRED=()
# Optional: work folders (checkouts, job temp files) on another volume, e.g. one Time Machine
# excludes, so its local snapshots don't pin what jobs delete (docs/macos-host.md).
# WORK_ROOT=/Volumes/CI/actions-runners
